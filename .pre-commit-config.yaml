# Install once with: pre-commit install
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
        exclude: ^(data/db/|site/src/data/)
      - id: trailing-whitespace
        exclude: ^(data/db/|site/src/data/|content/guides/)
      - id: check-yaml
        exclude: ^\.github/
  - repo: local
    hooks:
      - id: validate-content
        name: validate content/
        entry: ossmap validate
        language: system
        files: ^content/
        pass_filenames: false
