[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ossmap-collectors"
version = "0.1.0"
description = "Collectors, scoring and export for the OSS Map site."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28",
  "selectolax>=0.3",
  "pydantic>=2.10",
  "pyyaml>=6.0",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
dev = [
  "pytest>=8.3",
  "respx>=0.22",
  "ruff>=0.8",
  "mypy>=1.13",
  "types-PyYAML",
  "pre-commit>=4.0",
]

[project.scripts]
ossmap = "collectors.cli:main"

[tool.setuptools.packages.find]
include = ["collectors*"]

[tool.setuptools.package-data]
collectors = ["db/alembic.ini", "db/migrations/*.py", "db/migrations/versions/*.py", "db/migrations/script.py.mako"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"collectors/db/migrations/versions/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
exclude = ["collectors/db/migrations/"]

[[tool.mypy.overrides]]
module = ["selectolax.*"]
ignore_missing_imports = true
