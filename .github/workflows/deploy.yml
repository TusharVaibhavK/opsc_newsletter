name: Deploy

# Builds the static site and publishes it to GitHub Pages. Runs on pushes to main (content or
# code changes), after every Collect run, and on demand.
# One-time setup: Settings > Pages > Build and deployment > Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'site/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
  workflow_run:
    workflows: [Collect]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # After a Collect run, publish whatever it committed, unless the run was cancelled.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      # Check out the branch tip, not the triggering commit: after a collection run, the data
      # commit pushed moments ago must be included.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch || 'main' }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - uses: actions/configure-pages@v6
        id: pages
      - run: npm ci
        working-directory: site
      - name: Build
        working-directory: site
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          SITE_BASE: ${{ steps.pages.outputs.base_path }}/
          PUBLIC_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: npm run build
      - name: Internal links
        run: python3 scripts/check_links.py site/dist "${{ steps.pages.outputs.base_path }}/"
      - name: Privacy gate
        run: python3 scripts/check_privacy.py
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
